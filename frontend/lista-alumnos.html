<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Lista de Alumnos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="p-6 bg-gray-50 relative">

<div class="flex flex-col md:flex-row justify-between items-center gap-4 mb-6">
    <div class="bg-white p-2 rounded-lg shadow-md flex gap-4 items-center border-t-4 border-indigo-500 w-full md:w-2/3">
        <i class="fas fa-search text-gray-400 text-xl ml-2"></i>
        <input type="text" id="buscadorAlumnos" placeholder="Buscar alumno por correo..." class="border-none rounded-lg px-2 py-2 flex-1 focus:outline-none focus:ring-0 bg-transparent transition">
    </div>

    <button onclick="exportarAlumnosAExcel()" class="bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-6 rounded-lg shadow-md transition flex items-center w-full md:w-auto justify-center">
        <i class="fas fa-file-excel mr-2 text-xl"></i> Exportar Lista
    </button>
</div>

<div class="bg-white shadow-md rounded-lg overflow-hidden border border-gray-200">
    <table class="min-w-full leading-normal">
        <thead class="bg-indigo-50 text-indigo-800">
        <tr>
            <th class="px-5 py-4 text-left text-xs font-black uppercase tracking-wider">ID</th>
            <th class="px-5 py-4 text-left text-xs font-black uppercase tracking-wider">Estudiante</th>
            <th class="px-5 py-4 text-center text-xs font-black uppercase tracking-wider">Rol</th>
            <th class="px-5 py-4 text-center text-xs font-black uppercase tracking-wider">Acciones</th>
        </tr>
        </thead>
        <tbody id="tablaAlumnos" class="text-gray-700">
        <tr><td colspan="4" class="text-center py-8 text-indigo-500 animate-pulse font-bold">Cargando alumnos...</td></tr>
        </tbody>
    </table>
</div>

<div id="modalEstadisticas" class="fixed inset-0 bg-black bg-opacity-60 hidden flex items-center justify-center z-50 backdrop-blur-sm transition-opacity">
    <div class="bg-white w-11/12 max-w-lg rounded-2xl shadow-2xl overflow-hidden transform transition-all">
        <div class="bg-indigo-900 p-6 flex justify-between items-center">
            <h3 class="text-xl font-bold text-white flex items-center">
                <i class="fas fa-chart-pie mr-3 text-indigo-300"></i> Rendimiento del Alumno
            </h3>
            <button onclick="cerrarModalEstadisticas()" class="text-indigo-200 hover:text-white text-2xl font-bold transition">&times;</button>
        </div>

        <div class="p-6 bg-gray-50">
            <p id="modalCorreo" class="text-center text-gray-500 font-bold mb-6 text-lg border-b pb-4"></p>

            <div id="contenedorDatosModal" class="grid grid-cols-2 gap-4">
                <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 text-center">
                    <p class="text-xs text-gray-500 font-bold uppercase mb-1">Nota Media</p>
                    <p id="modalMedia" class="text-3xl font-black text-indigo-600">-</p>
                </div>
                <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 text-center">
                    <p class="text-xs text-gray-500 font-bold uppercase mb-1">Total Exámenes</p>
                    <p id="modalTotal" class="text-3xl font-black text-gray-800">-</p>
                </div>
                <div class="bg-green-50 p-4 rounded-xl shadow-sm border border-green-100 text-center">
                    <p class="text-xs text-green-600 font-bold uppercase mb-1">Aprobados</p>
                    <p id="modalAprobados" class="text-2xl font-black text-green-700">-</p>
                </div>
                <div class="bg-red-50 p-4 rounded-xl shadow-sm border border-red-100 text-center">
                    <p class="text-xs text-red-600 font-bold uppercase mb-1">Suspensos</p>
                    <p id="modalSuspensos" class="text-2xl font-black text-red-700">-</p>
                </div>
            </div>

            <div id="mensajeErrorModal" class="hidden text-center py-6">
                <i class="fas fa-folder-open text-4xl text-gray-300 mb-3 block"></i>
                <p class="text-gray-500 font-bold">Este alumno aún no ha realizado ningún examen.</p>
            </div>
        </div>

        <div class="bg-white p-4 border-t border-gray-200 text-center">
            <button onclick="cerrarModalEstadisticas()" class="bg-gray-800 hover:bg-gray-900 text-white font-bold py-2 px-8 rounded-lg shadow transition">Cerrar</button>
        </div>
    </div>
</div>

<script src="js/lista-alumnos.js"></script>
</body>
</html>

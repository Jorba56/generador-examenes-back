<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Haciendo Examen</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-200 min-h-screen pb-12">

<div class="bg-blue-900 text-white p-4 sticky top-0 z-50 shadow-md flex justify-between items-center">
    <div>
        <h1 id="tituloExamen" class="text-xl font-bold">Cargando examen...</h1>
        <p class="text-blue-300 text-sm">Lee atentamente cada pregunta antes de responder.</p>
    </div>
    <button onclick="abandonarExamen()" class="bg-red-500 hover:bg-red-600 px-4 py-2 rounded font-bold text-sm transition shadow">
        <i class="fas fa-times mr-2"></i> Abandonar
    </button>
</div>

<div class="max-w-4xl mx-auto mt-8 bg-white p-8 rounded-lg shadow-xl border-t-8 border-blue-600">

    <div id="contenedorPreguntas" class="space-y-8">
        <div class="text-center py-10 text-gray-500 animate-pulse">
            <i class="fas fa-spinner fa-spin text-3xl mb-3"></i>
            <p>Preparando tu examen...</p>
        </div>
    </div>

    <div id="zonaEntrega" class="mt-12 pt-6 border-t border-gray-200 text-center hidden">
        <button onclick="entregarExamen()" class="bg-green-600 hover:bg-green-700 text-white text-xl font-black py-4 px-12 rounded-full shadow-lg hover:shadow-xl transition transform hover:scale-105">
            <i class="fas fa-paper-plane mr-2"></i> ENTREGAR EXAMEN
        </button>
    </div>
</div>

<script src="js/ejecutar-examen.js"></script>
</body>
</html>

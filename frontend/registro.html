<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro Piloto - EduHub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,700;0,900;1,900&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Montserrat', sans-serif; }

        /* Fondo estilo fibra de carbono con el Azul Williams oscuro */
        .bg-carbon {
            background-color: #041E42;
            background-image: linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
        }

        /* Estilo para los inputs oscuros reutilizable */
        .input-racing {
            width: 100%;
            padding: 0.75rem 1rem;
            background-color: #041E42;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 0.25rem;
            color: white;
            transition: all 0.2s;
        }
        .input-racing:focus {
            outline: none;
            border-color: #00a3e0;
            border-radius: 1px; /* Toque Williams */
            box-shadow: 0 0 5px rgba(0, 163, 224, 0.5);
        }
        .input-racing::placeholder {
            color: rgba(191, 219, 254, 0.3);
        }

        /* Etiquetas de formulario estilo Williams */
        .label-racing {
            display: block;
            color: rgba(191, 219, 254, 0.7);
            font-size: 0.7rem;
            font-weight: 900;
            text-transform: uppercase;
            tracking: 0.15em;
            margin-bottom: 0.5rem;
        }
    </style>
</head>
<body class="bg-carbon min-h-screen flex items-center justify-center relative py-12 px-4">

<a href="index.html" class="absolute top-6 left-6 text-blue-200/70 hover:text-[#00a3e0] transition flex items-center gap-2 font-bold uppercase tracking-wider text-sm z-10">
    <i class="fas fa-arrow-left"></i> Volver a la parrilla
</a>

<div class="bg-[#0a2540] p-10 w-full max-w-2xl border-t-4 border-[#00a3e0] shadow-[0_20px_50px_rgba(0,0,0,0.5)] relative overflow-hidden group">

    <div class="absolute -right-10 -top-10 w-48 h-48 bg-[#005AFF] opacity-10 rounded-full blur-3xl group-hover:opacity-20 transition duration-500"></div>

    <div class="text-center mb-10 relative z-10">
        <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-[#041E42] border border-[#005AFF] text-[#00a3e0] text-2xl mb-4 shadow-[0_0_15px_rgba(0,90,255,0.2)]">
            <i class="fas fa-user-plus"></i>
        </div>
        <h2 class="text-3xl font-black text-white italic uppercase tracking-tighter">
            Registrar <span class="text-[#00a3e0]">Nuevo Usuario</span>
        </h2>
        <p class="text-blue-200/50 text-xs mt-2 uppercase tracking-widest font-bold">Únete a EduHub</p>
    </div>

    <form id="formRegistro" class="space-y-6 relative z-10">

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
                <label class="label-racing" for="regNombre">
                    <i class="fas fa-user mr-1 text-[#00a3e0]"></i> Nombre
                </label>
                <input type="text" id="regNombre" required class="input-racing" placeholder="Tu nombre">
            </div>
            <div>
                <label class="label-racing" for="regApellidos">
                    <i class="fas fa-user mr-1 text-[#00a3e0]"></i> Apellidos
                </label>
                <input type="text" id="regApellidos" required class="input-racing" placeholder="Tus apellidos">
            </div>
        </div>

        <div>
            <label class="label-racing" for="regCorreo">
                <i class="fas fa-envelope mr-1 text-[#00a3e0]"></i> Correo Electrónico
            </label>
            <input type="email" id="regCorreo" required class="input-racing" placeholder="ejemplo@correo.com">
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
                <label class="label-racing" for="regPassword">
                    <i class="fas fa-lock mr-1 text-[#00a3e0]"></i> Contraseña
                </label>
                <input type="password" id="regPassword" required class="input-racing" placeholder="••••••••">
            </div>
            <div>
                <label class="label-racing" for="regPasswordConfirm">
                    <i class="fas fa-check-circle mr-1 text-[#00a3e0]"></i> Confirmar Contraseña
                </label>
                <input type="password" id="regPasswordConfirm" required class="input-racing" placeholder="••••••••">
            </div>
        </div>

        <div id="mensajeError" class="bg-red-900/40 border border-red-500/50 text-red-400 text-sm p-3 rounded text-center hidden font-medium backdrop-blur-sm">
            <i class="fas fa-exclamation-triangle mr-2"></i> <span id="textoError">Error en el registro.</span>
        </div>

        <button type="submit" id="btnRegistrar"
                class="w-full bg-[#005AFF] text-white font-black py-4 px-4 shadow-[0_0_15px_rgba(0,90,255,0.4)] hover:bg-[#0047cc] transition transform hover:-translate-y-1 uppercase tracking-widest skew-x-[-10deg] mt-6 flex items-center justify-center group/btn disabled:opacity-50">
            <div class="skew-x-[10deg] flex items-center gap-2">
                Crear Cuenta <i class="fas fa-flag-checkered group-hover/btn:translate-x-1 transition-transform"></i>
            </div>
        </button>
    </form>

    <div class="mt-10 text-center border-t border-white/10 pt-6 relative z-10">
        <p class="text-xs text-blue-200/50 font-bold uppercase tracking-wider">
            ¿Ya tienes una cuenta?
            <a href="login.html" class="text-[#00a3e0] hover:text-white transition ml-1">Inicia Sesión aquí</a>
        </p>
    </div>
</div>

<script src="js/registro.js"></script>
</body>
</html>

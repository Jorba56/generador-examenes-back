<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generar Examen Automático</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 h-screen flex flex-col">

<nav class="bg-blue-600 p-4 shadow-lg text-white">
    <div class="container mx-auto flex justify-between items-center">
        <h1 class="text-xl font-bold">Generador Automático de Exámenes</h1>
        <button onclick="window.location.href='dashboard.html'" class="bg-gray-800 hover:bg-gray-900 px-4 py-2 rounded font-bold transition">
            ← Volver al Dashboard
        </button>
    </div>
</nav>

<main class="container mx-auto mt-12 p-4 flex justify-center">
    <form id="formGenerarExamen" class="bg-white p-8 rounded-lg shadow-xl border-t-4 border-purple-500 w-full max-w-lg">

        <h2 class="text-2xl font-bold text-gray-800 mb-6 text-center">Configura el Examen</h2>

        <div class="space-y-5">
            <div>
                <label class="block text-gray-700 font-bold mb-2">Título del Examen</label>
                <input type="text" id="titulo" required class="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-purple-500" placeholder="Ej: Test Final de Spring Boot">
            </div>

            <div>
                <label class="block text-gray-700 font-bold mb-2">Descripción</label>
                <textarea id="descripcion" rows="3" required class="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-purple-500" placeholder="Ej: Examen autogenerado para evaluar conocimientos..."></textarea>
            </div>

            <div>
                <label class="block text-gray-700 font-bold mb-2">Número de Preguntas</label>
                <input type="number" id="numPreguntas" required min="1" class="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-purple-500" placeholder="Ej: 10">
                <p class="text-xs text-gray-500 mt-1">El sistema elegirá esta cantidad de preguntas al azar de la base de datos.</p>
            </div>
        </div>

        <div class="mt-8">
            <button type="submit" id="btnGenerar" class="w-full bg-purple-600 hover:bg-purple-700 text-white text-lg font-bold py-3 px-8 rounded shadow-lg transition flex justify-center items-center">
                <span>Generar Examen Ahora</span>
            </button>
        </div>
    </form>
</main>

<script src="js/crear-examen.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Incidencias del Sistema</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 p-6 relative">

<div class="flex justify-between items-center mb-6">
    <h2 class="text-2xl font-bold text-gray-800"><i class="fas fa-shield-alt text-red-500 mr-2"></i> Registro de Errores</h2>
    <button onclick="cargarIncidencias()" class="bg-gray-800 hover:bg-gray-900 text-white font-bold py-2 px-4 rounded shadow transition">
        <i class="fas fa-sync-alt mr-2"></i> Refrescar
    </button>
</div>

<div class="bg-white shadow-md rounded-lg overflow-hidden border-t-4 border-red-500">
    <div class="bg-white p-4 rounded-lg shadow-md mb-6 flex gap-4 items-center">
        <i class="fas fa-filter text-gray-400"></i>
        <select id="filtroTipo" class="border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-red-500 bg-gray-50">
            <option value="todas">Últimas 50 (Todas)</option>
            <option value="clase">Filtrar por Clase de Java</option>
            <option value="metodo">Filtrar por Método</option>
            <option value="usuario">Filtrar por ID de Usuario</option>
        </select>

        <input type="text" id="filtroValor" placeholder="Ej: UserService..." class="border border-gray-300 rounded px-3 py-2 flex-1 hidden focus:outline-none focus:ring-2 focus:ring-red-500">

        <button onclick="aplicarFiltro()" class="bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-6 rounded transition shadow">
            Buscar
        </button>
    </div>
    <table class="min-w-full leading-normal">
        <thead class="bg-gray-50 text-gray-600">
        <tr>
            <th class="px-5 py-3 text-left text-xs font-bold uppercase">ID / Fecha</th>
            <th class="px-5 py-3 text-left text-xs font-bold uppercase">Endpoint</th>
            <th class="px-5 py-3 text-left text-xs font-bold uppercase">Clase de Error</th>
            <th class="px-5 py-3 text-center text-xs font-bold uppercase">Usuario</th>
            <th class="px-5 py-3 text-center text-xs font-bold uppercase">Acciones</th>
        </tr>
        </thead>
        <tbody id="tablaIncidencias" class="text-gray-700">
        <tr><td colspan="5" class="text-center py-8 text-gray-500 animate-pulse">Cargando incidencias...</td></tr>
        </tbody>
    </table>
</div>

<div id="modalTraza" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-50">
    <div class="bg-white w-11/12 max-w-4xl rounded-lg shadow-2xl flex flex-col max-h-[90vh]">
        <div class="flex justify-between items-center p-4 border-b bg-red-50 rounded-t-lg">
            <h3 class="text-xl font-bold text-red-800" id="modalTitulo">Detalles del Error</h3>
            <button onclick="cerrarModal()" class="text-gray-500 hover:text-red-500 text-2xl font-bold">&times;</button>
        </div>

        <div class="p-6 overflow-y-auto flex-1 bg-gray-50">
            <div class="grid grid-cols-2 gap-4 mb-4 text-sm">
                <p><strong>Tipo:</strong> <span id="modalTipo" class="text-blue-600 font-mono"></span></p>
                <p><strong>Método:</strong> <span id="modalMetodo" class="text-purple-600 font-mono"></span></p>
            </div>
            <h4 class="font-bold text-gray-800 mb-2">Stacktrace (Traza):</h4>
            <pre id="modalTextoTraza" class="bg-gray-900 text-green-400 p-4 rounded text-xs font-mono overflow-x-auto shadow-inner"></pre>
        </div>

        <div class="p-4 border-t bg-white rounded-b-lg flex justify-end">
            <button onclick="cerrarModal()" class="bg-gray-800 hover:bg-gray-900 text-white font-bold py-2 px-6 rounded">Cerrar</button>
        </div>
    </div>
</div>

<script src="js/incidencias.js"></script>
</body>
</html>

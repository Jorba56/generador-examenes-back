spring.application.name=api-gateway
server.port=8080
spring.main.web-application-type=reactive

# ==========================================
# CORS GLOBAL (Evita el 99% de los Failed to Fetch)
# ==========================================
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOrigins=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=*

# ==========================================
# RUTAS SPRING BOOT 4 (Sin espacios tras las comas)
# ==========================================
spring.cloud.gateway.server.webflux.routes[0].id=usuarios-service
spring.cloud.gateway.server.webflux.routes[0].uri=http://usuarios-service:8081
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/usuarios/**,/roles/**,/usuarios_roles/**,/v3/api-docs/usuarios,/auth/**
spring.cloud.gateway.server.webflux.routes[0].filters[0]=RewritePath=/v3/api-docs/usuarios,/v3/api-docs

spring.cloud.gateway.server.webflux.routes[1].id=incidencias-service
spring.cloud.gateway.server.webflux.routes[1].uri=http://incidencias-service:8082
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/incidencias/**,/v3/api-docs/incidencias
spring.cloud.gateway.server.webflux.routes[1].filters[0]=RewritePath=/v3/api-docs/incidencias,/v3/api-docs

# ==========================================
# SWAGGER
# ==========================================
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.urls[0].name=API Usuarios
springdoc.swagger-ui.urls[0].url=/v3/api-docs/usuarios
springdoc.swagger-ui.urls[1].name=API Incidencias
springdoc.swagger-ui.urls[1].url=/v3/api-docs/incidencias